[project]
name = "pytalk"
version = "0.1.0"
description = "Stock analysis dashboard"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.42",
    "Authlib>=1.3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance>=0.2.50",
    "duckdb>=1.1",
    "plotly>=5.24",
    "backtesting>=0.3.3",
    "bokeh>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytalk"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
